name: Python Wheels

on:

  # Run on all changes (PR and push) to the python binding
  # source/configuration files, except on the release branches, which
  # have their own workflow, which also publish to pypi/test.pypi.
  # Note that changes to the core libraries will *not*
  # trigger building the wheels. However, the main ci workflow does
  # build and test the bindings (for a single python version on a
  # single arch)
  #
  # On push/PR, build only a single representative python version on
  # a representative architecture per OS, to keep this fast. The full
  # version x architecture matrix runs nightly instead (trunk-health),
  # so gaps in push/PR coverage are still caught regularly rather than
  # only at release time; the publish and publish-test workflows
  # (triggered by a release/release-candidate) always build the full
  # matrix.

  schedule:
    # Nightly, but skipped (see check-trunk-changed below) if nothing
    # has merged since the last successful nightly run -- development
    # activity here is bursty.
    - cron: '30 6 * * *'  # 06:30 UTC, nightly
  push:
    paths:
      - 'cmake/**'
      - 'src/lib/**'
      - 'src/wrappers/python/**'
      - 'pyproject.toml'
      - '!share/ci/**'
      - '!.github/workflows/**'
      - '.github/workflows/python-wheels.yml'
  pull_request:
    paths:
      - 'cmake/**'
      - 'src/lib/**'
      - 'src/wrappers/python/**'
      - 'pyproject.toml'
      - '!share/ci/**'
      - '!.github/workflows/**'
      - '.github/workflows/python-wheels.yml'

permissions:
  contents: read

concurrency:
  # cary: key on the source branch name (head_ref for pull_request events,
  # ref_name for push/schedule events) rather than github.ref, so a
  # push-triggered run and the pull_request-triggered run for the same
  # branch share one concurrency group. See ci_workflow.yml for the
  # full rationale.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

jobs:
  check-trunk-changed:
    # Only relevant to the nightly schedule (full-matrix) run: see
    # ci_workflow.yml for the rationale. This job only runs for the
    # schedule event (and only in the upstream repo); it's skipped
    # outright for push/pull_request, which are driven by an actual
    # code change already and don't need this check.
    name: Check for trunk changes since last nightly run
    if: >-
      github.event_name == 'schedule' &&
      github.repository == 'AcademySoftwareFoundation/openexr'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Compare HEAD to the last successful nightly run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          last_sha=$(gh run list --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" --event schedule --status success \
            --json headSha --jq '.[0].headSha // empty' --limit 1)
          if [ -z "$last_sha" ] || [ "$last_sha" != "${{ github.sha }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits since the last successful nightly run ($last_sha); skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  setup:
    name: Determine wheel build matrix
    needs: check-trunk-changed
    # check-trunk-changed only runs (and reports "changed") for the
    # schedule event; it's skipped for push/pull_request, so don't
    # gate on its output except when it actually ran.
    if: >-
      github.event_name != 'schedule' ||
      needs.check-trunk-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      archs: ${{ steps.matrix.outputs.archs }}
      python_build: ${{ steps.matrix.outputs.python_build }}
    steps:
      - name: Determine matrix
        id: matrix
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            # pre-merge: a single python version, one representative
            # architecture per OS.
            archs='[
              {"os":"ubuntu-latest","arch":"x64"},
              {"os":"macos-latest","arch":"arm64","cibw_archs_macos":"arm64"},
              {"os":"windows-latest","arch":"x64","cibw_archs_windows":"AMD64"}
            ]'
            python_build="cp313-*"
          else
            # trunk-health (nightly): full version x architecture matrix.
            archs='[
              {"os":"ubuntu-latest","arch":"x64"},
              {"os":"ubuntu-24.04-arm","arch":"arm64"},
              {"os":"macos-15-intel","arch":"x64","cibw_archs_macos":"x86_64 universal2"},
              {"os":"macos-latest","arch":"arm64","cibw_archs_macos":"arm64"},
              {"os":"windows-latest","arch":"x64","cibw_archs_windows":"AMD64"},
              {"os":"windows-11-arm","arch":"arm64","cibw_archs_windows":"ARM64"}
            ]'
            python_build="cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
          fi
          echo "archs=$(echo "$archs" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "python_build=$python_build" >> "$GITHUB_OUTPUT"

  build_wheels:
    name: Python Wheels - ${{ matrix.os }}-${{ matrix.arch }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.setup.outputs.archs) }}

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Create sdist
        # Only create it once.
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pipx run build==1.2.2.post1 --sdist . --outdir wheelhouse

      - name: Build wheel
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae  # v4.2.1
        with:
          output-dir: wheelhouse
        env:
          # Split macOS arches across runners so artifact merge does not collide on filenames.
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_archs_macos }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.cibw_archs_windows }}
          # Single version on push/PR, cp39 through cp315 on the nightly
          # trunk-health run (see the "setup" job above).
          CIBW_BUILD: ${{ needs.setup.outputs.python_build }}
          # Skip 32-bit wheels builds on Windows
          # Also skip the PyPy builds, since they fail the unit tests
          # NumPy's Windows ARM64 wheels require Python 3.11 or newer.
          CIBW_SKIP: "*-win32 *_i686 cp39-win_arm64 cp310-win_arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ./wheelhouse/*.whl
            ./wheelhouse/*.tar.gz

  verify_publish_artifacts:
    name: Verify merged wheel artifacts
    needs: build_wheels
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Download wheel artifacts separately
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: artifacts

      - name: Detect duplicate distribution filenames
        run: |
          set -euo pipefail

          mapfile -t dupes < <(
            find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec basename {} \; \
              | sort \
              | uniq -d
          )

          if ((${#dupes[@]} > 0)); then
            echo "::error::Duplicate distribution filenames across build artifacts:"
            printf '  %s\n' "${dupes[@]}"
            exit 1
          fi

      - name: Download wheel artifacts (as publish does)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Verify wheel ZIP integrity
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=(dist/*.whl)
          if ((${#wheels[@]} == 0)); then
            echo "::error::No wheels found in dist/"
            exit 1
          fi

          for wheel in "${wheels[@]}"; do
            echo "Checking $wheel"
            python3 -m zipfile -t "$wheel"
          done

      - name: Validate distribution metadata
        run: pipx run twine==6.1.0 check dist/*
