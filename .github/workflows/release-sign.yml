#
# Releases are signed via https://github.com/sigstore/sigstore-python.
# See https://docs.sigstore.dev for information about sigstore.
#
# This action creates a .tar.gz of the complete OpenEXR source tree at
# the given release tag, signs it via sigstore, and uploads the
# .tar.gz and the associated .tar.gz.sigstore credential bundle.
#
# It also builds the C/C++ libraries at the tag, in the pinned container,
# and signs and uploads a manifest of the sha256 checksum of every
# installed file (openexr-<version>.sha256) with its credential bundle.
# Reproduce a release and compare it to the manifest as described in
# "Reproducible Builds" in website/install.rst.
#
# To verify a downloaded release at a given tag:
# 
#   % pip install sigstore
#   % sigstore verify github --cert-identity https://github.com/AcademySoftwareFoundation/openexr/.github/workflows/release-sign.yml@refs/tags/<tag> openexr-<tag>.tar.gz
#
# The manifest is verified the same way, substituting
# openexr-<version>.sha256 for the tarball.
#
# To sign an existing release after publish (e.g. workflow fix): Actions →
# Sign Release → Run workflow → enter the release tag (e.g. v3.2.8).

name: Sign Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign (e.g. v3.2.8)"
        required: true
        type: string

permissions:
  contents: read
  
jobs:
  manifest:
    name: Build release and write checksum manifest
    runs-on: ubuntu-latest
    container:
      # Keep in sync with reproducible_build.yml and website/install.rst.
      image: aswf/ci-openexr:2026@sha256:490239732e1a2472228938ec0f33565365815381f1f0225c02b368933bbb4d4a
    env:
      CXX: g++
      CC: gcc
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 1
      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build and write the manifest
        run: |
          share/ci/scripts/linux/check_reproducible_build.sh \
              --manifest "$GITHUB_WORKSPACE/openexr-${TAG//v}.sha256" \
              "$GITHUB_WORKSPACE"
        shell: bash
      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: openexr-*.sha256

  release:
    name: Sign & upload release artifacts
    needs: manifest
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: write   # required for gh release upload (attach assets)
      id-token: write   # required for sigstore OIDC signing
    steps:

      - name: Set Prefix
        # The tag name begins with a 'v', e.g. "v3.2.4", but the prefix
        # should omit the 'v', so the tarball "openexr-3.2.4.tar.gz"
        # extracts files into "openexr-v3.2.4/...".  This matches
        # the GitHub release page autogenerated artifact conventions.
        run: |
          echo OPENEXR_PREFIX=openexr-${TAG//v}/ >> $GITHUB_ENV
          echo OPENEXR_TARBALL=openexr-${TAG//v}.tar.gz >> $GITHUB_ENV
        shell: bash

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Create archive
        run: git archive --format=tar.gz -o ${OPENEXR_TARBALL} --prefix ${OPENEXR_PREFIX} ${TAG}

      - name: Download manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest

      - name: Sign archive and manifest with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ${{ env.OPENEXR_TARBALL }} openexr-*.sha256
          upload-signing-artifacts: false
          release-signing-artifacts: false

      - name: Upload release archive and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${TAG} ${OPENEXR_TARBALL} ${OPENEXR_TARBALL}.sigstore.json \
              openexr-*.sha256 openexr-*.sha256.sigstore.json

