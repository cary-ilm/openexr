name: Bazel

# Skip the run on *.md changes and on changes to the website, *except*
# for "website/src", since that code needs validation.  There's a
# separate workflow for with website.

on:
  push:
    paths:
      - '**'
      - '!**.md'
      - '!website/**'
      - 'website/src/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/bazel_build.yml'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!website/**'
      - 'website/src/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/bazel_build.yml'

permissions:
  contents: read

concurrency:
  # cary: key on the source branch name (head_ref for pull_request events,
  # ref_name for push/tag events) rather than github.ref, so a push-triggered
  # run and the pull_request-triggered run for the same branch share one
  # concurrency group. Without this, pushing to a branch with an open PR
  # fires both a push run (github.ref = refs/heads/<branch>) and a
  # pull_request run (github.ref = refs/pull/<n>/merge) in *different*
  # groups, so neither cancels the other and both run to completion as
  # uncancelled duplicates.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

jobs:
  build_and_test_ubuntu:
    name: Linux Ubuntu 26.04 Bazel build <GCC 15>
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-26.04
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Mount Bazel cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: "/home/runner/.cache/bazel"
        key: bazel-ubuntu-26

    - name: Build
      run: |
        bazel build //...
        bazel test --test_output=errors //...

  build_and_test_windows:
    name: Windows Server 2025 build <Visual Studio 2022>
    if: github.event.pull_request.draft != true
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Mount Bazel cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: "/home/runner/.cache/bazel"
        key: bazel-windows-2025

    - name: Build
      run: |
        bazel build //...
        bazel test --test_output=errors //...

  build_and_test_macos:
    name: macOS 26 Bazel build <Apple Clang15>
    if: github.event.pull_request.draft != true
    runs-on: macos-26

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Mount Bazel cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: "/home/runner/.cache/bazel"
        key: bazel-macos-26

    - name: Build
      run: |
        bazel build //...
        bazel test --test_output=errors //...
