#
# Build and test on FreeBSD using a community VM action. GitHub does
# not provide native FreeBSD runners; this uses vmactions/netbsd-vm.
# Note that this runs the OS in a VM and executes the "run" script via
# SSH, so the usual actions/checkout doesn't work.

name: CI (FreeBSD)

on:
  push:
    paths:
      - '**'
      - '!**.md'
      - '!website/**'
      - '!bazel/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/ci_freebsd.yml'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!website/**'
      - '!bazel/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/ci_freebsd.yml'

permissions:
  contents: read

concurrency:
  # cary: key on the source branch name (head_ref for pull_request events,
  # ref_name for push/tag events) rather than github.ref, so a push-triggered
  # run and the pull_request-triggered run for the same branch share one
  # concurrency group. Without this, pushing to a branch with an open PR
  # fires both a push run (github.ref = refs/heads/<branch>) and a
  # pull_request run (github.ref = refs/pull/<n>/merge) in *different*
  # groups, so neither cancels the other and both run to completion as
  # uncancelled duplicates.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

jobs:
  freebsd:
    name: FreeBSD
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc  # v1.5.9
        with:
          release: '15.0'
          envs: GITHUB_REPOSITORY GITHUB_REF GITHUB_SHA
          usesh: true
          prepare: |
            pkg install -y cmake ninja git
          run: |
            set -e
            git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" src
            cd src
            # shallow clone, only the commit that triggered the run, i.e. GITHUB_SHA
            git fetch --depth 1 origin "${GITHUB_SHA}"
            git checkout "${GITHUB_SHA}"

            cmake -B _build -S . -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DOPENEXR_FORCE_INTERNAL_IMATH=ON \
              -DOPENEXR_FORCE_INTERNAL_DEFLATE=ON \
              -DOPENEXR_FORCE_INTERNAL_ZSTD=ON \
              -DOPENEXR_FORCE_INTERNAL_OPENJPH=ON \
              -DBUILD_TESTING=ON
            cmake --build _build

            # Run "portability" tests only: they test likelihood of
            # OS/toolchain/libc-dependent behavior -- e.g.  threading,
            # CPU dispatch, byte order, UTF-8 paths, built-tool
            # validation) to keep this VM job fast; full coverage runs
            # on the primary Linux/macOS/Windows CI jobs.
            ctest --test-dir _build --output-on-failure -L portability
