# The CI workflow uses steps defined in ci_steps.yml, via the "uses:"
# directive. Linux, macOS, and Windows all share a common set of
# configure/build/validate steps.

name: CI

# Run on all changes except:
# - markdown/doc changes
# - changes to the website, *except* for "website/src", since that
#   code needs validation.  The website has a separate workflow
# - changes to the bazel config (it has its own workflow
# - changes to the python bindings (they have their own workflow)
# - changes to workflows other than this one
#
# Also run nightly (but only if something has changed since the last
# such run -- see the "check-trunk-changed" job below), and on any tag
# push (release or release-candidate). See the "category:" comment
# below.

on:
  schedule:
    # Nightly "trunk health" run: catches regressions in the matrix
    # entries that are skipped on ordinary push/PR (see "category:"
    # below), and in this workflow's own pre-merge jobs, in case of
    # drift from external dependencies/containers/runner images --
    # independent of whether a release is imminent, so problems
    # surface close to the commit that caused them rather than at
    # release-candidate time. Development activity is bursty (stretches
    # of inactivity followed by several merges at once), so this fires
    # every night but the check-trunk-changed job below skips the rest
    # of the run on nights where nothing merged since the last run.
    - cron: '15 6 * * *'  # 06:15 UTC, nightly
  push:
    paths:
      - '**'
      - '!ASWF/**'
      - '!Contrib/**'
      - '!CODEOWNERS'
      - '!.mailmap'
      - '!.git-blame-ignore-revs'
      - '!.gitignore'
      - '!sonar-project.properties'
      - '!pyproject.toml'
      - '!share/util/**'
      - '!**/*bazel*'
      - '!**.md'
      - '!website/**'
      - 'website/src/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/ci_workflow.yml'
      - '.github/workflows/ci_steps.yml'
  pull_request:
    paths:
      - '**'
      - '!ASWF/**'
      - '!Contrib/**'
      - '!CODEOWNERS'
      - '!.mailmap'
      - '!.git-blame-ignore-revs'
      - '!.gitignore'
      - '!sonar-project.properties'
      - '!pyproject.toml'
      - '!share/util/**'
      - '!**/*bazel*'
      - '!**.md'
      - '!website/**'
      - 'website/src/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/ci_workflow.yml'
      - '.github/workflows/ci_steps.yml'

permissions:
  contents: read

concurrency:
  # cary: key on the source branch name (head_ref for pull_request events,
  # ref_name for push/tag events) rather than github.ref, so a push-triggered
  # run and the pull_request-triggered run for the same branch share one
  # concurrency group. Without this, pushing to a branch with an open PR
  # fires both a push run (github.ref = refs/heads/<branch>) and a
  # pull_request run (github.ref = refs/pull/<n>/merge) in *different*
  # groups, so neither cancels the other and both run to completion as
  # uncancelled duplicates.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

# NOTE: Each job has a "name" describing the specific build variant,
# which appears in the "jobs" listing on the GitHub actions page. The
# (sanitized) name identifies the reference install manifest in
# share/ci/install_manifest, e.g. a name of "clang c++20"
# corresponds to install_manifest.<os>.clang-c-20.txt. The
# validate_install.py script compares the job's generated
# install_manifest.txt to the reference file to validate that the
# proper files have been installed.
#
# If you add jobs, you must add a corresponding
# share/ci/install_manifest file, named after the job's (sanitized)
# name.

jobs:
  check-trunk-changed:
    # Gates the nightly schedule run: if nothing has merged since the
    # last successful nightly run, there's nothing new to validate, so
    # skip the (expensive) build matrix entirely. Always runs (and
    # always reports "changed=true") for push/pull_request/tag events,
    # which are driven by an actual code change already.
    name: Check for trunk changes since last nightly run
    # The nightly schedule fires independently on every fork that has
    # this workflow on its default branch; restrict it to the upstream
    # repo so forks don't burn their own Actions minutes on it.
    if: >-
      github.event.pull_request.draft != true &&
      (github.event_name != 'schedule' || github.repository == 'AcademySoftwareFoundation/openexr')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Compare HEAD to the last successful nightly run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_sha=$(gh run list --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" --event schedule --status success \
            --json headSha --jq '.[0].headSha // empty' --limit 1)
          if [ -z "$last_sha" ] || [ "$last_sha" != "${{ github.sha }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits since the last successful nightly run ($last_sha); skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: 'Linux: ${{ matrix.name }}'
    needs: check-trunk-changed
    if: needs.check-trunk-changed.outputs.changed == 'true'
    permissions:
      contents: write  # required by ci_steps (upload-artifact)
    uses: ./.github/workflows/ci_steps.yml
    with:
      # Set values for the "inputs:" as defined in ci_steps.yml
      # Note the defaults provided here for the builds that don't specify
      # values.
      os: ubuntu-latest
      name: ${{ matrix.name }}
      # DockerHub: https://hub.docker.com/u/aswf
      # Source: https://github.com/AcademySoftwareFoundation/aswf-docker
      container: ${{ matrix.container || format('aswf/ci-openexr:{0}', matrix.vfx-cy || '2027') }}
      cmake: ${{ matrix.cmake || '3.14.7' }}
      cxx-standard: ${{ matrix.cxx-standard || '17' }}
      cxx-compiler: ${{ matrix.cxx-compiler || 'g++' }}
      cc-compiler: ${{ matrix.cc-compiler || 'gcc' }}
      build-type: ${{ matrix.build-type || 'Release' }}
      BUILD_SHARED_LIBS: ${{ matrix.BUILD_SHARED_LIBS || 'ON' }}
      OPENEXR_ENABLE_THREADING: ${{ matrix.OPENEXR_ENABLE_THREADING || 'ON' }}
      OPENEXR_INSTALL_PKG_CONFIG: ${{ matrix.OPENEXR_INSTALL_PKG_CONFIG || 'ON' }}
      OPENEXR_INSTALL_DOCS: ${{ matrix.OPENEXR_INSTALL_DOCS || 'ON' }}
      OPENEXR_BUILD_EXAMPLES: ${{ matrix.OPENEXR_BUILD_EXAMPLES || 'ON' }}
      OPENEXR_BUILD_TOOLS: ${{ matrix.OPENEXR_BUILD_TOOLS || 'ON' }}
      OPENEXR_FORCE_INTERNAL_IMATH: ${{ matrix.OPENEXR_FORCE_INTERNAL_IMATH || 'OFF' }}
      OPENEXR_IMATH_TAG: ${{ matrix.OPENEXR_IMATH_TAG || '5f27ba266d3ea1565e912570c30b5eafc89959f1' }} # v3.2.3
      OPENEXR_FORCE_INTERNAL_DEFLATE: ${{ matrix.OPENEXR_FORCE_INTERNAL_DEFLATE || 'OFF' }}
      OPENEXR_FORCE_INTERNAL_ZSTD: ${{ matrix.OPENEXR_FORCE_INTERNAL_ZSTD || 'OFF' }}
      OPENEXR_FORCE_INTERNAL_OPENJPH: ${{ matrix.OPENEXR_FORCE_INTERNAL_OPENJPH || 'OFF' }}
      openjph_version:  ${{ matrix.openjph_version || '0.32.0' }}
      BUILD_TESTING: ${{ matrix.BUILD_TESTING || 'ON' }}
      RUN_TESTING: ${{ matrix.RUN_TESTING || 'ON' }}
      # On a tag push (release/release-candidate) or a nightly
      # schedule run, run the full test suite everywhere, overriding
      # any per-job test_category restriction (e.g. 'portability').
      test_category: ${{ !(startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule') && matrix.test_category || '' }}
      namespace: ${{ matrix.namespace }}
      validate_install: ${{ matrix.validate_install || 'ON' }}
      configure_install_prefix: ${{ matrix.configure_install_prefix }}
      # "category:" determines *when* a matrix entry runs (enforced in
      # ci_steps.yml): left unset (the common case), it runs on push,
      # pull_request, nightly, and tag. Set to 'trunk-health', it's
      # skipped on push/PR and only runs on the nightly schedule and
      # tag -- for matrix entries whose coverage is redundant with
      # another entry's on every push/PR (e.g. older vfx-platform
      # years, older macOS versions, deprecated mingw32), so they
      # still get regular (nightly) and release-time validation
      # without slowing down every push/PR.
      category: ${{ matrix.category }}

    strategy:
      fail-fast: false
      matrix:
        include:

          - name: Release

          - name: Debug
            build-type: Debug
            test_category: 'portability'

          - name: static
            BUILD_SHARED_LIBS: 'OFF'
            test_category: 'portability'

          - name: threads=OFF
            OPENEXR_ENABLE_THREADING: 'OFF'
            test_category: 'threading'

          - name: pkgconfig=OFF, examples=OFF, tools=OFF, docs=OFF, internal deflate
            OPENEXR_INSTALL_PKG_CONFIG: 'OFF'
            OPENEXR_INSTALL_DOCS: 'OFF'
            OPENEXR_BUILD_EXAMPLES: 'OFF'
            OPENEXR_BUILD_TOOLS: 'OFF'
            OPENEXR_FORCE_INTERNAL_IMATH: 'ON'
            OPENEXR_FORCE_INTERNAL_DEFLATE: 'ON'
            OPENEXR_FORCE_INTERNAL_ZSTD: 'ON'
            OPENEXR_FORCE_INTERNAL_OPENJPH: 'ON'
            BUILD_TESTING: 'OFF'
            configure_install_prefix: '.tmp'
            cmake: 3.15.7

          - name: custom namespace
            namespace: 'TEST_NAMESPACE'
            # The namespace is purely a compile-time symbol-naming concern;
            # skip the tests entirely
            RUN_TESTING: 'OFF'

          - name: clang
            cxx-compiler: clang++
            cc-compiler: clang

          - name: cmake 4
            cmake: 4.0.3

          - name: clang c++20
            cxx-compiler: clang++
            cc-compiler: clang
            cxx-standard: 20
            validate_install: OFF
            test_category: 'portability'

          - name: gcc c++20
            cxx-standard: 20
            validate_install: OFF
            test_category: 'portability'

          - name: STATIC w/vendored OpenJPH
            OPENEXR_FORCE_INTERNAL_OPENJPH: 'ON'
            BUILD_SHARED_LIBS: 'OFF'
            RUN_TESTING: 'OFF'

          - name: outdated OpenJPH
            openjph_version: '0.31.0'
            validate_install: 'OFF'
            BUILD_TESTING: 'OFF'

          - name: vfx2026
            vfx-cy: 2026
            test_category: 'portability'
            category: trunk-health

          - name: vfx2025
            vfx-cy: 2025
            test_category: 'portability'
            category: trunk-health

          - name: vfx2024
            vfx-cy: 2024
            test_category: 'portability'
            category: trunk-health

          - name: vfx2023
            vfx-cy: 2023
            test_category: 'portability'
            category: trunk-health

          - name: Fedora Rawhide
            container: fedora:rawhide
            cmake: '3.31.6'
            OPENEXR_FORCE_INTERNAL_IMATH: 'ON'
            OPENEXR_FORCE_INTERNAL_DEFLATE: 'OFF'
            OPENEXR_FORCE_INTERNAL_ZSTD: 'OFF'
            OPENEXR_FORCE_INTERNAL_OPENJPH: 'ON'
            OPENEXR_INSTALL_DOCS: 'OFF'
            validate_install: 'OFF'
            test_category: 'portability'

          - name: Alpine
            container: alpine:3.21
            cmake: '3.31.1'
            OPENEXR_FORCE_INTERNAL_IMATH: 'ON'
            OPENEXR_FORCE_INTERNAL_DEFLATE: 'ON'
            OPENEXR_FORCE_INTERNAL_ZSTD: 'ON'
            OPENEXR_FORCE_INTERNAL_OPENJPH: 'ON'
            OPENEXR_INSTALL_DOCS: 'OFF'
            validate_install: 'OFF'
            test_category: 'portability'

  macOS:
    name: 'macOS: ${{ matrix.name }}'
    needs: check-trunk-changed
    if: needs.check-trunk-changed.outputs.changed == 'true'
    permissions:
      contents: write  # required by ci_steps (upload-artifact)
    uses: ./.github/workflows/ci_steps.yml
    with:
      # Set values for the "inputs:" as defined in ci_steps.yml
      # Note the defaults provided here for the builds that don't specify
      # values.
      os: ${{ matrix.os || 'macos-15' }}
      name: ${{ matrix.name }}
      cc-compiler: ${{ matrix.cc-compiler || 'clang' }}
      cxx-compiler: ${{ matrix.cxx-compiler || 'clang++' }}
      cxx-standard: ${{ matrix.cxx-standard || '17' }}
      build-type: ${{ matrix.build-type || 'Release' }}
      BUILD_SHARED_LIBS: ${{ matrix.BUILD_SHARED_LIBS || 'ON' }}
      OPENEXR_ENABLE_THREADING: ${{ matrix.OPENEXR_ENABLE_THREADING || 'ON' }}
      OPENEXR_INSTALL_PKG_CONFIG: ${{ matrix.OPENEXR_INSTALL_PKG_CONFIG || 'ON' }}
      OPENEXR_INSTALL_DOCS: ${{ matrix.OPENEXR_INSTALL_DOCS || 'ON' }}
      OPENEXR_BUILD_EXAMPLES: ${{ matrix.OPENEXR_BUILD_EXAMPLES || 'ON' }}
      OPENEXR_BUILD_TOOLS: ${{ matrix.OPENEXR_BUILD_TOOLS || 'ON' }}
      OPENEXR_FORCE_INTERNAL_IMATH: ${{ matrix.OPENEXR_FORCE_INTERNAL_IMATH || 'OFF' }}
      OPENEXR_IMATH_TAG: ${{ matrix.OPENEXR_IMATH_TAG || '5f27ba266d3ea1565e912570c30b5eafc89959f1' }} # v3.2.3
      OPENEXR_FORCE_INTERNAL_DEFLATE: ${{ matrix.OPENEXR_FORCE_INTERNAL_DEFLATE || 'OFF' }}
      OPENEXR_FORCE_INTERNAL_ZSTD: ${{ matrix.OPENEXR_FORCE_INTERNAL_ZSTD || 'OFF' }}
      OPENEXR_FORCE_INTERNAL_OPENJPH: ${{ matrix.OPENEXR_FORCE_INTERNAL_OPENJPH || 'OFF' }}
      openjph_version:  ${{ matrix.openjph_version || '0.32.0' }}
      CMAKE_OSX_ARCHITECTURES: ${{ matrix.CMAKE_OSX_ARCHITECTURES }}
      BUILD_TESTING: ${{ matrix.BUILD_TESTING || 'ON' }}
      RUN_TESTING: ${{ matrix.RUN_TESTING || 'ON' }}
      # On a tag push or a nightly schedule run, run the full test
      # suite everywhere, overriding any per-job test_category
      # restriction (e.g. 'portability').
      test_category: ${{ !(startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule') && matrix.test_category || '' }}
      validate_install: ${{ matrix.validate_install || 'ON' }}
      configure_install_prefix: ${{ matrix.configure_install_prefix }}
      category: ${{ matrix.category }}

    strategy:
      fail-fast: false
      matrix:
        include:

          - name: Release

          - name: Debug
            build-type: Debug
            test_category: 'portability'

          - name: static
            BUILD_SHARED_LIBS: 'OFF'
            test_category: 'portability'

          - name: threads=OFF
            OPENEXR_ENABLE_THREADING: 'OFF'
            test_category: 'threading'

          - name: pkgconfig=OFF, examples=OFF, tools=OFF, docs=OFF, internal imath+deflate
            OPENEXR_INSTALL_PKG_CONFIG: 'OFF'
            OPENEXR_INSTALL_DOCS: 'OFF'
            OPENEXR_BUILD_EXAMPLES: 'OFF'
            OPENEXR_BUILD_TOOLS: 'OFF'
            OPENEXR_FORCE_INTERNAL_IMATH: 'ON'
            OPENEXR_FORCE_INTERNAL_DEFLATE: 'ON'
            OPENEXR_FORCE_INTERNAL_ZSTD: 'ON'
            OPENEXR_FORCE_INTERNAL_OPENJPH: 'ON'
            BUILD_TESTING: 'OFF'
            configure_install_prefix: '.tmp'
            cmake: 3.15.7

          - name: macos-15-intel
            os: macos-15-intel
            test_category: 'portability'
            category: trunk-health

          - name: macos-14
            os: macos-14
            test_category: 'portability'
            category: trunk-health

          - name: universal2
            CMAKE_OSX_ARCHITECTURES: "x86_64;arm64"
            test_category: 'portability'

          - name: clang c++20
            cxx-standard: 20
            validate_install: OFF
            test_category: 'portability'

          - name: gcc c++20
            cc-compiler: gcc
            cxx-compiler: g++
            cxx-standard: 20
            validate_install: OFF

  windows:
    name: 'Windows: ${{ matrix.name }}'
    needs: check-trunk-changed
    if: needs.check-trunk-changed.outputs.changed == 'true'
    permissions:
      contents: write  # required by ci_steps (upload-artifact)
    uses: ./.github/workflows/ci_steps.yml
    with:
      # Set values for the "inputs:" as defined in ci_steps.yml
      # Note the defaults provided here for the builds that don't specify
      # values.
      os: ${{ matrix.os || 'windows-2022' }}
      name: ${{ matrix.name }}
      cxx-standard: ${{ matrix.cxx-standard || '17' }}
      build-type: ${{ matrix.build-type || 'Release' }}
      BUILD_SHARED_LIBS: ${{ matrix.BUILD_SHARED_LIBS || 'ON' }}
      OPENEXR_ENABLE_THREADING: ${{ matrix.OPENEXR_ENABLE_THREADING || 'ON' }}
      OPENEXR_INSTALL_PKG_CONFIG: ${{ matrix.OPENEXR_INSTALL_PKG_CONFIG || 'ON' }}
      OPENEXR_INSTALL_DOCS: ${{ matrix.OPENEXR_INSTALL_DOCS || 'OFF' }}
      OPENEXR_BUILD_EXAMPLES: ${{ matrix.OPENEXR_BUILD_EXAMPLES || 'ON' }}
      OPENEXR_BUILD_TOOLS: ${{ matrix.OPENEXR_BUILD_TOOLS || 'ON' }}
      OPENEXR_FORCE_INTERNAL_IMATH: ${{ matrix.OPENEXR_FORCE_INTERNAL_IMATH || 'OFF' }}
      OPENEXR_IMATH_TAG: ${{ matrix.OPENEXR_IMATH_TAG || '5f27ba266d3ea1565e912570c30b5eafc89959f1' }} # v3.2.3
      OPENEXR_FORCE_INTERNAL_DEFLATE: ${{ matrix.OPENEXR_FORCE_INTERNAL_DEFLATE || 'OFF' }}
      OPENEXR_FORCE_INTERNAL_ZSTD: ${{ matrix.OPENEXR_FORCE_INTERNAL_ZSTD || 'OFF' }}
      OPENEXR_FORCE_INTERNAL_OPENJPH: ${{ matrix.OPENEXR_FORCE_INTERNAL_OPENJPH || 'OFF' }}
      openjph_version:  ${{ matrix.openjph_version || '0.32.0' }}
      msystem: ${{ matrix.msystem }}
      BUILD_TESTING: ${{ matrix.BUILD_TESTING || 'ON' }}
      RUN_TESTING: ${{ matrix.RUN_TESTING || 'ON' }}
      # On a tag push or a nightly schedule run, run the full test
      # suite everywhere, overriding any per-job test_category
      # restriction (e.g. 'portability').
      test_category: ${{ !(startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule') && matrix.test_category || '' }}
      validate_install: ${{ matrix.validate_install || 'ON' }}
      configure_install_prefix: ${{ matrix.configure_install_prefix }}
      category: ${{ matrix.category }}
      CMAKE_GENERATOR_PLATFORM: ${{ matrix.CMAKE_GENERATOR_PLATFORM }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release

          - name: Debug
            build-type: Debug
            test_category: 'portability'

          - name: static
            BUILD_SHARED_LIBS: 'OFF'
            test_category: 'portability'

          - name: threads=OFF
            # TODO: this currently fails to compile; switch to OFF once the fix is in.
            OPENEXR_ENABLE_THREADING: 'ON'
            test_category: 'threading'

          - name: pkgconfig=OFF, examples=OFF, tools=OFF, docs=OFF, internal imath+deflate
            OPENEXR_INSTALL_PKG_CONFIG: 'OFF'
            OPENEXR_INSTALL_DOCS: 'OFF'
            OPENEXR_BUILD_EXAMPLES: 'OFF'
            OPENEXR_BUILD_TOOLS: 'OFF'
            OPENEXR_FORCE_INTERNAL_IMATH: 'ON'
            OPENEXR_FORCE_INTERNAL_DEFLATE: 'ON'
            OPENEXR_FORCE_INTERNAL_ZSTD: 'ON'
            OPENEXR_FORCE_INTERNAL_OPENJPH: 'ON'
            BUILD_TESTING: 'OFF'
            configure_install_prefix: '.tmp'
            cmake: 3.15.7

          - name: win32-MSVC-x86
            # Validates the 32-bit Windows build using the native MSVC x86
            # toolset (cmake -A Win32), since MSYS2's MINGW32 environment
            # (below) is deprecated with no replacement.
            CMAKE_GENERATOR_PLATFORM: Win32
            test_category: 'portability'

          - name: vfx2023
            os: windows-2022
            category: trunk-health

            # Build w/msys2, mingw32 and ucrt64, shared and static.

          - name: msys2-mingw32
            msystem: MINGW32
            category: trunk-health

          - name: msys2-mingw32, static
            msystem: MINGW32
            BUILD_SHARED_LIBS: 'OFF'
            test_category: 'portability'
            category: trunk-health

          - name: msys2-ucrt64
            msystem: UCRT64

          - name: msys2-ucrt64, static
            msystem: UCRT64
            BUILD_SHARED_LIBS: 'OFF'
            test_category: 'portability'

          - name: c++20
            cxx-standard: 20
            validate_install: OFF
            test_category: 'portability'

          - name: msys2-clang64
            msystem: CLANG64
            validate_install: OFF

          - name: clang
            cxx-compiler: clang++
            cc-compiler: clang
            validate_install: OFF

